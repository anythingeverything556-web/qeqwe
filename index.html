<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHATGBT Twitch TTS Control Room</title>
    <!-- Google Fonts: Playfair Display for headers, Special Elite for typewriter headers, Courier Prime for logs/monospaced text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- v8 fonts: Chakra Petch (display/headings) + DM Sans (body) + JetBrains Mono (code/console) -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <!-- NUCLEAR GUARD: Block custom_sounds from EVER being written to localStorage.
         Old versions stored base64 audio here (10-15MB), exceeding the 5MB quota and
         crashing the app with QuotaExceededError. This script:
         1. Removes any existing custom_sounds key
         2. Patches localStorage.setItem to REJECT writes to 'custom_sounds'
         This runs BEFORE React and guarantees the crash can NEVER happen again. -->
    <script>
      (function(){
        try { localStorage.removeItem('custom_sounds'); } catch(e) {}
        var _origSetItem = localStorage.setItem.bind(localStorage);
        localStorage.setItem = function(key, value) {
          if (key === 'custom_sounds') {
            console.warn('[GUARD] Blocked write to localStorage.custom_sounds — audio data belongs on server only');
            return;
          }
          return _origSetItem(key, value);
        };
        console.log('[CHATGBT] Build v3.2 — localStorage guard active');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
